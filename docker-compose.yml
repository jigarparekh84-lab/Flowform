# Flowform — one-command local stack
# Web UI :5180  |  Optimize API :5182
# Usage:  docker compose up --build
# DB only (local dev / tests):  docker compose up -d db   → postgres://flowform:flowform@127.0.0.1:5433/flowform

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: flowform
      POSTGRES_PASSWORD: flowform  # local dev only
      POSTGRES_DB: flowform
    ports:
      - "5433:5432"  # 5433 so it never collides with a host Postgres on 5432
    volumes:
      - flowform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowform -d flowform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6380 so it never collides with a host Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+psycopg://flowform:flowform@db:5432/flowform
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://flowform:flowform@db:5432/flowform
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: arq
      AUTH_MODE: dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "5182:5182"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5182/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:5182
    ports:
      - "5180:5180"
    depends_on:
      api:
        condition: service_healthy

volumes:
  flowform-db:
