name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (data tests, lint, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Data tests
        run: npm run test:data
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  api:
    name: API (mypy, lint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: flowform
          POSTGRES_PASSWORD: flowform
          POSTGRES_DB: flowform
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U flowform -d flowform"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://flowform:flowform@127.0.0.1:5433/flowform
      REDIS_URL: redis://127.0.0.1:6380/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/engine/pyproject.toml
      - name: Install (hashed lock + local engine)
        run: |
          pip install -r requirements.txt
          pip install --no-deps ../engine
          pip install -r requirements-dev.txt
      - name: Type-check (mypy)
        run: mypy
      - name: Lint (ruff — syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Migrations (upgrade + drift check)
        run: alembic upgrade head && alembic check
      - name: Pytest
        run: pytest -q

  e2e:
    name: E2E (Playwright critical path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: flowform
          POSTGRES_PASSWORD: flowform
          POSTGRES_DB: flowform
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U flowform -d flowform"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://flowform:flowform@127.0.0.1:5433/flowform
      # Practise what the smoke asserts: it only passes against a real workspace.
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/engine/pyproject.toml
      - name: Install API
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          pip install --no-deps ../engine
      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      # Playwright starts the API and the web dev server itself (playwright.config.ts);
      # AUTH_MODE=dev is loopback-only, and the runner talks to 127.0.0.1.
      - name: Critical path smoke
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  prometheus:
    name: Prometheus rules (promtool check + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/rules:ro" --entrypoint promtool
          prom/prometheus:v2.50.0 check rules /rules/flowform.rules.yml
      - name: Test rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/rules:ro" --entrypoint promtool
          prom/prometheus:v2.50.0 test rules /rules/flowform.rules.test.yml

  benchmark:
    # Static name: a required status check is matched by its displayed name, so a
    # name that interpolates a repo variable would silently detach the gate.
    name: Benchmark (stress-200 budget)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      STRESS_TIMEOUT_S: ${{ vars.STRESS_TIMEOUT_S || '60' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/engine/pyproject.toml
      - name: Install (hashed lock + local engine)
        run: |
          pip install -r requirements.txt
          pip install --no-deps ../engine
      - name: stress-120 / stress-200 benchmark
        run: |
          set -o pipefail
          pytest -q -s tests/test_stress_benchmark.py | tee bench.log
          echo "### Solver benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '\[benchmark' bench.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
