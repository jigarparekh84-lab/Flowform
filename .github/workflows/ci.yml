name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (data tests, lint, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Data tests
        run: npm run test:data
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  api:
    name: API (lint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: flowform
          POSTGRES_PASSWORD: flowform
          POSTGRES_DB: flowform
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U flowform -d flowform"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://flowform:flowform@127.0.0.1:5433/flowform
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/engine/pyproject.toml
      - run: pip install -r requirements.txt ruff
      - name: Lint (ruff — syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Migrations (upgrade + drift check)
        run: alembic upgrade head && alembic check
      - name: Pytest
        run: pytest -q

  benchmark:
    name: Benchmark (stress-200 < ${{ vars.STRESS_TIMEOUT_S || '60' }} s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      STRESS_TIMEOUT_S: ${{ vars.STRESS_TIMEOUT_S || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/engine/pyproject.toml
      - run: pip install -r requirements.txt
      - name: stress-120 / stress-200 benchmark
        run: |
          set -o pipefail
          pytest -q -s tests/test_stress_benchmark.py | tee bench.log
          echo "### Solver benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '\[benchmark' bench.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
