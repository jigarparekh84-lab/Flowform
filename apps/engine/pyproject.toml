[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowform-engine"
version = "0.1.0"
description = "Flowform network-design optimization engine (PuLP + HiGHS)"
requires-python = ">=3.11"
dependencies = ["pulp>=2.8,<3", "highspy>=1.7"]

[tool.setuptools]
packages = ["flowform_engine"]
